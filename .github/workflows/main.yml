name: RDP 32bit Itel
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: LiteManager 32bit
        run: |
          Write-Host "Telechargement 32bit..."
          Invoke-WebRequest -Uri https://raw.githubusercontent.com/infinixamart71-droid/rdp_10win/main/ROMServer.exe -OutFile ROMServer.exe
          .\ROMServer.exe /S
          Start-Sleep -Seconds 15
          Write-Host "Installe..."
          $id = Get-Content "C:\Program Files (x86)\LiteManager Pro - Server\ID.txt" -ErrorAction SilentlyContinue
          if(-not $id){ $id = Get-Content "$env:APPDATA\LiteManager\ID.txt" -ErrorAction SilentlyContinue }
          Write-Host "========== ID POUR ITEL A04: $id =========="
          for($i=0; $i -lt 360; $i++){ Write-Host "ON $i min ID $id"; Start-Sleep 60 }
