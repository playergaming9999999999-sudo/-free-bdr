name: Gestionnaire RDP Lite
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Configurer LiteManager
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Write-Host "Telechargement ROMServer..."
          try {
            Invoke-WebRequest -Uri "https://github.com/infinixamart71-droid/rdp_10win/releases/download/v2/ROMServer.exe" -OutFile ROMServer.exe -UserAgent "Mozilla/5.0"
          } catch {
            Invoke-WebRequest -Uri "https://gitlab.com/chamod12/lmnop/-/raw/main/ROMServer.exe" -OutFile ROMServer.exe
          }
          Start-Sleep -Seconds 5
          Write-Host "Installation..."
          Start-Process .\ROMServer.exe -ArgumentList "/S" -Wait
          Start-Sleep -Seconds 15
          $idPath = "C:\Program Files (x86)\LiteManager Pro - Server\ID.txt"
          if(Test-Path $idPath){ Get-Content $idPath }
          Write-Host "ID cherche aussi ici:"
          Get-ChildItem -Path $env:APPDATA -Filter ID.txt -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "ID: $(Get-Content $_.FullName)" }
          Write-Host "Mot de passe par defaut: 123456"
          for($i=0; $i -lt 360; $i++){
            Write-Host "RDP Actif $i min - Laisse cette fenetre ouverte"
            Start-Sleep -Seconds 60
          }
