name: LiteManager
on:
  workflow_dispatch:
jobs:
  build:
    name: Start Building...
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Downloading & Installing Essentials
        run: |
          Invoke-WebRequest -Uri "https://gitlab.com/chamod12/lmnop/-/raw/main/Downloads.bat" -OutFile Downloads.bat
          cmd /c Downloads.bat
      - name: Connect to LiteManager
        run: cmd /c show.bat
      - name: Time Counter
        run: cmd /c loop.bat
